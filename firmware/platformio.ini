; GPS Dog Collar firmware — built on smart-pet-device-sdk.
;
;   pio run -d firmware
;   wokwi-cli firmware --scenario firmware/collar.test.yaml --timeout 20000
;
; The pre-SDK single-file firmware is kept as collar-firmware.legacy.cpp and is
; not compiled (build_src_filter below).

[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32 @ ^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = min_spiffs.csv

build_src_filter = +<main.cpp>
build_unflags = -std=gnu++11 -std=gnu++14
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=2
    -DMQTT_MAX_PACKET_SIZE=1024

lib_deps =
    ; TODO re-pin to a main SHA once smart-pet-device-sdk#2 (publishLocation) merges
    https://github.com/jubasjl76-eng/smart-pet-device-sdk.git#feat/publish-location
    bblanchon/ArduinoJson @ ^7.0.0
    madhephaestus/ESP32Servo @ ^3.0.5
    mikalhart/TinyGPSPlus @ ^1.0.3
